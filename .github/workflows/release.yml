name: Build & Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode keystore
        run: echo "${{ secrets.SUB_CONVERTER_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: app/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.SUB_CONVERTER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SUB_CONVERTER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SUB_CONVERTER_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
